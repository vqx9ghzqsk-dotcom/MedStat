<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#07090e;color:#f1f5f9;font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden;height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#212c42;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#324263}

.glass-panel{background:rgba(22,29,44,0.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.06);box-shadow:0 8px 32px 0 rgba(0,0,0,0.37)}
.glass-tab{background:rgba(13,17,26,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.04)}

.tab-bar{display:flex;align-items:end;gap:4px;height:48px;padding:0 16px;background:#07090e;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-item{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px 10px 0 0;font-size:12.5px;font-weight:600;color:#64748b;cursor:pointer;white-space:nowrap;transition:all .2s;position:relative;border:1px solid transparent;border-bottom:none;max-width:220px;user-select:none}
.tab-item:hover{color:#94a3b8;background:rgba(255,255,255,0.03)}
.tab-item.active{color:#fff;background:#0d111a;border-color:rgba(255,255,255,0.08);box-shadow:0 -4px 20px rgba(0,0,0,0.2)}
.tab-item.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#d44d4d}
.tab-item .tab-close{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#64748b;transition:all .15s;opacity:0}
.tab-item:hover .tab-close{opacity:1}
.tab-item .tab-close:hover{background:rgba(212,77,77,0.2);color:#fca5a5}

.card-hover{transition:all .3s;position:relative;overflow:hidden;cursor:pointer}
.card-hover:hover{transform:translateY(-4px);border-color:rgba(212,77,77,0.3);box-shadow:0 12px 30px -10px rgba(212,77,77,0.15)}

.modal-overlay{position:fixed;inset:0;background:rgba(7,9,14,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100;display:none;align-items:center;justify-content:center;padding:10px;opacity:0;transition:all .3s}
@media(max-width:640px){.modal-overlay{padding:0}}
.modal-overlay.show{display:flex;opacity:1}
.modal-box{width:100%;max-width:1100px;max-height:90vh;background:#0d111a;border:1px solid rgba(255,255,255,0.08);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transform:scale(.95) translateY(20px);transition:all .3s;box-shadow:0 25px 50px -12px rgba(0,0,0,0.7)}
@media(max-width:640px){.modal-box{max-width:100%;max-height:100vh;height:100vh;border-radius:0;border:none}}
.modal-overlay.show .modal-box{transform:scale(1) translateY(0)}

.custom-table{width:100%;border-collapse:collapse}
.custom-table th{background:#161d2c;padding:12px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;text-align:left}
.custom-table td{padding:12px 16px;font-size:13px;color:#cbd5e1;border-bottom:1px solid rgba(255,255,255,0.04)}
.custom-table tr:hover td{background:rgba(255,255,255,0.02)}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:200;background:#161d2c;border:1px solid rgba(255,255,255,0.1);color:#e2e8f0;font-size:12px;font-weight:500;padding:12px 16px;border-radius:12px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);transform:translateY(32px);opacity:0;transition:all .3s;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateY(0);opacity:1}

.line-clamp-2{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.chevron-rotated{transform:rotate(90deg)}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
.border-t-3{border-top-width:3px}
.border-l-3{border-left-width:3px}
button{font-family:inherit}

.app-root{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#07090e}
.workspace{display:flex;flex:1;overflow:hidden;position:relative}
.sidebar{width:18rem;min-width:240px;background:#0d111a;border-right:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;height:100%;user-select:none;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .3s}
.sidebar.open{transform:translateX(0)}
@media(min-width:768px){.sidebar{position:static;transform:translateX(0)}}
.mobile-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
.mobile-backdrop.show{display:block}
@media(min-width:768px){.mobile-backdrop{display:none!important}}
.main-content{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;background:#07090e;min-width:0}
.app-header{height:3.5rem;padding:0 1rem;background:rgba(22,29,44,0.7);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between;z-index:10;flex-shrink:0;gap:.75rem}
@media(min-width:640px){.app-header{padding:0 2rem}}
.content-scroll{flex:1;overflow-y:auto;padding:1rem;padding-bottom:5rem}
@media(min-width:640px){.content-scroll{padding:2rem;padding-bottom:2rem}}

.stats-grid{display:grid;grid-template-columns:1fr;gap:1rem;margin-bottom:2rem}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.cards-grid-3{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:768px){.cards-grid-3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.cards-grid-3{grid-template-columns:repeat(3,1fr)}}
.cards-grid-4{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:640px){.cards-grid-4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.cards-grid-4{grid-template-columns:repeat(4,1fr)}}
.all-diseases-grid{display:grid;grid-template-columns:1fr}
@media(min-width:768px){.all-diseases-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.all-diseases-grid{grid-template-columns:repeat(3,1fr)}}
.all-diseases-grid>div{padding:1rem;border-bottom:1px solid rgba(255,255,255,0.05)}
@media(min-width:768px){.all-diseases-grid>div{border-right:1px solid rgba(255,255,255,0.05)}}

.nav-btn{width:100%;display:flex;align-items:center;gap:.75rem;padding:.625rem .75rem;border-radius:.75rem;font-size:12px;font-weight:600;color:#cbd5e1;background:transparent;border:none;cursor:pointer;transition:all .2s;text-align:left}
.nav-btn:hover{background:rgba(255,255,255,0.05);color:#fff}
.nav-btn.active{background:rgba(212,77,77,0.2);color:#f0b1b1}
.nav-btn-child{width:100%;padding:.5rem .75rem;border-radius:.5rem;font-size:12px;font-weight:600;color:#cbd5e1;background:transparent;border:none;cursor:pointer;transition:all .2s;text-align:left}
.nav-btn-child:hover{background:rgba(255,255,255,0.05);color:#fff}
.nav-btn-child.active{background:rgba(255,255,255,0.05);color:#fff}
.nav-btn-grandchild{width:100%;padding:.375rem .75rem;border-radius:.5rem;font-size:11px;color:#94a3b8;background:transparent;border:none;cursor:pointer;transition:all .2s;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn-grandchild:hover{background:rgba(255,255,255,0.05);color:#fff}

.modal-tabs-bar{background:#0d111a;border-bottom:1px solid rgba(255,255,255,0.05);flex-shrink:0}
.modal-tabs-scroll{overflow-x:auto;scrollbar-width:none}
.modal-tabs-scroll::-webkit-scrollbar{display:none}
.modal-tabs-inner{display:flex;gap:.25rem;padding:.5rem;min-width:max-content}
@media(min-width:640px){.modal-tabs-inner{padding:.5rem 1rem}}
.modal-tab-btn{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border-radius:.5rem;font-size:12px;font-weight:600;color:#94a3b8;background:transparent;border:1px solid transparent;cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap;font-family:inherit}
@media(min-width:640px){.modal-tab-btn{padding:.5rem 1rem;font-size:.875rem}}
.modal-tab-btn:hover{background:rgba(255,255,255,0.05);color:#fff}
.modal-tab-btn.active{background:rgba(212,77,77,0.2);color:#f0b1b1;border-color:rgba(212,77,77,0.3)}

.section-title{font-size:.875rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:.5rem}
.section-title::before{content:'';width:.375rem;height:1rem;background:#d44d4d;border-radius:9999px;display:inline-block}

.molecule-card{padding:1rem;border-radius:.75rem;background:#0d111a;border:1px solid rgba(255,255,255,0.05);transition:all .2s}
.molecule-card:hover{border-color:rgba(255,255,255,0.1)}
.brand-tag{font-size:10px;font-weight:600;padding:.25rem .5rem;border-radius:.375rem;border:1px solid;display:inline-block}

.stat-card{padding:1.25rem;border-radius:1rem;border-left:4px solid;background:rgba(22,29,44,0.7);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.06);box-shadow:0 8px 32px 0 rgba(0,0,0,0.37);border-left-width:4px}
.featured-card{padding:1.25rem;border-radius:1rem;background:rgba(22,29,44,0.7);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.06);box-shadow:0 8px 32px 0 rgba(0,0,0,0.37);border-top:3px solid #d44d4d;cursor:pointer;transition:all .3s}
.featured-card:hover{transform:translateY(-4px);border-color:rgba(212,77,77,0.3);box-shadow:0 12px 30px -10px rgba(212,77,77,0.15)}

.hide-mobile{display:none}
@media(min-width:768px){.hide-mobile{display:flex}}
.hide-desktop{display:flex}
@media(min-width:768px){.hide-desktop{display:none}}

.badge-pill{padding:.25rem .625rem;border-radius:9999px;font-size:10px;font-weight:bold;display:inline-block;flex-shrink:0}
.badge-tag{font-size:9px;padding:.125rem .5rem;border-radius:.25rem;background:rgba(255,255,255,0.05);color:#94a3b8;display:inline-block}

/* Floating buttons */
.fab-container{position:fixed;bottom:1.25rem;right:1.25rem;z-index:40;display:flex;flex-direction:column;gap:.5rem;align-items:flex-end}
.fab-btn{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;border-radius:9999px;color:#fff;font-size:.875rem;font-weight:700;border:none;cursor:pointer;transition:all .3s;box-shadow:0 10px 25px -5px rgba(0,0,0,0.4)}
.fab-btn:hover{transform:scale(1.05)}
.fab-btn:active{transform:scale(.95)}
.fab-upload{background:linear-gradient(to right,#10b981,#059669)}
.fab-generate{background:linear-gradient(to right,#a855f7,#9333ea)}
.fab-label{white-space:nowrap}
@media(max-width:640px){.fab-label{display:none}}

/* Drop zone */
.drop-zone{border:2px dashed rgba(255,255,255,0.1);border-radius:1rem;padding:2rem;text-align:center;transition:all .2s;cursor:pointer}
.drop-zone:hover,.drop-zone.dragover{border-color:#10b981;background:rgba(16,185,129,0.1)}

/* Select / input styling */
select,input[type=text],input[type=email],textarea{font-family:inherit}
select option{background:#0d111a;color:#f1f5f9}

/* Spinner */
.spinner{width:4rem;height:4rem;border:4px solid rgba(168,85,247,0.2);border-top-color:#a855f7;border-radius:50%;animation:spin 1s linear infinite}
.spinner-green{border-color:rgba(16,185,129,0.2);border-top-color:#10b981}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* File item */
.file-item{padding:.75rem;border-radius:.75rem;border:1px solid;display:flex;align-items:center;gap:.75rem;transition:all .2s}
.file-item.pending{background:#0d111a;border-color:rgba(255,255,255,0.05)}
.file-item.uploading{background:rgba(59,130,246,0.05);border-color:rgba(59,130,246,0.2)}
.file-item.done{background:rgba(16,185,129,0.05);border-color:rgba(16,185,129,0.2)}
.file-item.error{background:rgba(239,68,68,0.05);border-color:rgba(239,68,68,0.2)}
</style>
</head>
<body>

<div class="app-root">
  <div class="tab-bar" id="tabBar"></div>
  <div class="workspace">
    <div class="mobile-backdrop" id="mobileBackdrop" onclick="closeMobileSidebar()"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="app-header">
        <div style="display:flex;align-items:center;gap:.5rem;min-width:0;flex:1">
          <button onclick="toggleMobileSidebar()" class="hide-desktop glass-tab" style="width:2.25rem;height:2.25rem;border-radius:.5rem;border:none;cursor:pointer;color:#cbd5e1;display:flex;align-items:center;justify-content:center;flex-shrink:0" aria-label="Menu">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2Z"/></svg>
          </button>
          <h2 id="headerTitle" style="font-size:.75rem;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">Tableau de bord général</h2>
          <span class="badge-pill hide-mobile" style="background:rgba(212,77,77,0.08);color:#d44d4d">MedStat</span>
        </div>
        <div style="display:flex;align-items:center;gap:.5rem;flex-shrink:0">
          <div class="glass-tab" style="padding:.375rem .75rem;border-radius:.75rem;display:flex;align-items:center;gap:.5rem;width:8rem;max-width:100%">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="#94a3b8" style="flex-shrink:0"><path d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5l-1.5 1.5l-5-5v-.79l-.27-.27A6.52 6.52 0 0 1 9.5 16A6.5 6.5 0 0 1 3 9.5A6.5 6.5 0 0 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14S14 12 14 9.5S12 5 9.5 5"/></svg>
            <input type="text" id="searchInput" placeholder="Rechercher..." style="background:transparent;border:none;outline:none;font-size:11px;color:#e2e8f0;width:100%;font-family:inherit" onkeyup="handleSearch(event)">
          </div>
        </div>
      </header>
      <div class="content-scroll" id="mainContent"></div>
    </main>
  </div>

  <!-- Floating buttons -->
  <div class="fab-container" id="fabContainer">
    <button class="fab-btn fab-generate" onclick="openGenerateModal()" title="Générer une fiche DRETEP par IA">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.3 8.4C19.7 8 19.7 7.3 19.3 6.9L17.1 4.7C16.7 4.3 16 4.3 15.6 4.7L9.6 10.7L7.4 8.5L5.9 10L8.1 12.2L5.9 14.4L7.4 15.9L9.6 13.7L11.8 15.9L13.3 14.4L11.1 12.2L19.3 8.4Z"/></svg>
      <span class="fab-label">Générer</span>
    </button>
    <button class="fab-btn fab-upload" onclick="openUploadModal()" title="Ajouter un document">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span class="fab-label">Ajouter</span>
    </button>
  </div>

  <!-- Disease Modal -->
  <div class="modal-overlay" id="diseaseModalOverlay" onclick="if(event.target===this)closeDiseaseModal()">
    <div class="modal-box" id="diseaseModalBox"></div>
  </div>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="uploadModalOverlay" onclick="if(event.target===this)closeUploadModal()">
    <div class="modal-box" id="uploadModalBox" style="max-width:720px"></div>
  </div>

  <!-- Generate Modal -->
  <div class="modal-overlay" id="generateModalOverlay" onclick="if(event.target===this)closeGenerateModal()">
    <div class="modal-box" id="generateModalBox" style="max-width:760px"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="#e47e7e"><path d="M11 9h2V7h-2m1 13c-4.41 0-8-3.59-8-8s3.59-8 8-8s8 3.59 8 8s-3.59 8-8 8m0-18A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m-1 15h2v-6h-2z"/></svg>
    <span id="toastText">Action effectuée</span>
  </div>
</div>

// ════════════════════════════════════════════════════════════════════════════

sium", "posologie": "1 cuillère à soupe × 3/j après repas", "mecanisme": "Neutralisation acide-base immédiate dans la lumière gastrique, effet pansement et adsorbant. Action symptomatique de courte durée.", "marques": ["Maalox® suspension buvable", "Phosphalugel® sachet", "Gaviscon® suspension"]}]}}, {"name": "Diarrhées aiguës et chroniques", "concepts": "Mécanismes sécrétoires et osmotiques, déshydratation hydro-électrolytique, altération de la barrière intestinale.", "urgences": "Déshydratation aiguë sévère avec choc hypovolémique (ex : choléra), acidose métabolique sévère.", "dretrepe": {"definition": "Augmentation du nombre de selles (> 3 par jour) et modification de leur consistance (liquides ou molles).", "rappel": "Physiologie de l'absorption de l'eau et des électrolytes dans le grêle et le côlon.", "etiologie": "Infections virales, bactériennes ou parasitaires, toxines, maladies inflammatoires chroniques de l'intestin (MICI).", "traitement": "Réhydratation orale (SRO) ou intraveineuse, solutés de réhydratation, ralentisseurs du transit (si non infectieuses), antibiothérapie ciblée.", "evolution": "Généralement bénigne et spontanément résolutive en quelques jours, risque de déshydratation mortelle chez les populations vulnérables.", "paraclinique": "Coproculture, examen parasitologique des selles, ionogramme sanguin en cas de sévérité."}, "id": "diarrhees-aigues-et-chroniques", "specialty": "Gastro-entérologie & Hépatologie", "partId": "1", "partName": "1. Médecine Interne", "pharmacology": {"title": "Réhydratation et antisécrétoires intestinaux", "general": "Le traitement du choléra et des diarrhées aiguës repose sur la réhydratation, seul traitement réellement efficace. Les SRO (sels de réhydratation orale OMS) exploitent le co-transport sodium-glucose intégral à la bordure en brosse entérocytaire. En cas de déshydratation sévère (choléra grivois), perfusion de Ringer Lactate IV rapide (100 mL/kg en 3 h chez l'adulte). L'antibiothérapie (doxycycline, azithr rmeture des canaux K-ATP, libération d'insuline. Risque d'hypoglycémie surtout chez le sujet âgé.", "marques": ["Glibenclamide Orchidia 5 mg", "Glibenclamide Dekopharm 5 mg", "Daonil® 5 mg", "Daomide Uniquepharma (Glibenclamide)", "Glibenclamide-Denk 5 mg", "Glibenclamide-Shalina 5 mg"]}, {"name": "Insuline NPH (intermédiaire)", "posologie": "0,2–0,4 UI/kg/j SC, 1 à 2 injections", "mecanisme": "Insuline humaine à action intermédiaire (12–18 h), couverture basale. À associer à l'insuline rapide aux repas en schéma basal-bolus.", "marques": ["Insuline NPH Dekopharm 100 UI/mL", "Insulatard® NPH 100 UI/mL", "Lantus® 100 UI/mL (analogue lent)", "Insuline NPH Uniquepharma 100 UI/mL", "Insuline-Denk NPH 100 UI/mL", "Insuline NPH-Shalina 100 UI/mL"]}, {"name": "Insuline rapide (acidocétose)", "posologie": "0,1 UI/kg/h IV puis relais SC", "mecanisme": "Insuline humaine régulière IV : suppression de la cétogénèse et de la lipolyse, normalisation de la glycémie. Surveillance kaliémie toutes les 2 h.", "marques": ["Actrapid® HM 100 UI/mL", "Actrapid® HM 100 UI/mL", "Humulin R® 100 UI/mL", "Insuline NPH Uniquepharma 100 UI/mL", "Insuline-Denk NPH 100 UI/mL", "Insuline NPH-Shalina 100 UI/mL"]}]}}, {"name": "Pathologies thyroïdiennes (Hypo/Hyperthyroïdie)", "concepts": "Rétrocontrôle hypothalamo-hypophysaire (TSH/T3/T4), métabolisme basal, auto-immunité thyroïdienne.", "urgences": "Crise thyrotoxique aiguë (orage thyroïdien) et coma myxœdémateux.", "dretrepe": {"definition": "Dérèglement de la production des hormones thyroïdiennes (T3 et T4) par la glande thyroïde.", "rappel": "Axe hypothalamo-hypophysothyroïdien et rôle des hormones thyroïdiennes sur le métabolisme énergétique.", "etiologie": "Thyroïdite de Hashimoto (hypothyroïdie), maladie de Basedow (hyperthyroïdie auto-immune), carence iodée.", "traitement": "Hormonothérapie substitutive par lévothyroxine (hypothyroïdie), antithyroïdiens de synthèse, iode radioactif ou chirurgie (hyperthyroïdie).", "evolution": "Contrôle à long terme généralement satisfaisant, surveillance biologique régulière nécessaire.", "paraclinique": "Dosage de la TSH ultrasensible, T4 libre, anticorps antithyroïdiens (anti-TPO, anti-récepteurs de la TSH)."}, "id": "pathologies-thyroidiennes-hypo-hyperthyroidie", "specialty": "Endocrinologie & Métabolisme", "partId": "1", "partName": "1. Médecine Interne", "pharmacology": {"title": "Antithyroïdiens et hormones thyroïdiennes", "general": "L'hyperthyroïdie est traitée par les antithyroïdiens de synthèse (ATS) qui inhibent la thyroperoxydase (TPO), réduisant la synthèse de T3/T4. Le carbimazole (prodrogue du thiamazole) est la molécule de référence. En phase d'attaque, bêta-bloquant (propranolol) pour contrôler les symptômes adrénergiques. L'hypothyroïdie est substituée par la levothyroxine à vie. Surveillance : TSH et T4 libres toutes les 4-6 semaines, NFS (agranulocytose sous ATS), bilan hépatique.", "molecules": [{"name": "Carbimazole (antithyroïdien de synthèse)", "posologie": "20–40 mg/j PO → 5–10 mg/j entretien", "mecanisme": "Prodrogue métabolisée en thiamazole, inhibition de la thyroperoxydase, bloc de l'iodation des tyrosines et de la coupling T3/T4.", "marques": ["Néo-Mercazole® 5 mg", "Néo-Mérontyl Pharmakina", "Carbimazole Générique 5 mg"]}, {"name": "Levothyroxine (substitution hypothyroïdie)", "posologie": "1,6 µg/kg/j PO, à jeun (moyenne: 100–150 µg/j)", "mecanisme": "Hormone thyroïdienne de synthèse, conversion périphérique en T3 active, régulation du métabolisme de base. Surdosage : tachycardie, ostéoporose.", "marques": ["Levothyroxine Pharmakina 50 µg", "Levothyrox® 50 µg", "Euthyral® (T3+T4)", "Levothyroxine Uniquepharma 50 µg", "Levothyroxine-Denk 50 µg", "Levothyroxine-Shalina 50 µg"]}, {"name": "Propranolol (β-bloquant non sélectif)", "posologie": "40 mg × 3/j PO pendant la phase d'attaque", "mecanisme": "Blocs des récepteurs β-1 et β-2 adrénergiques, ralentissement cardiaque, baisse de la conversion périphérique T4→T3 aux fortes doses.", "marques": ["Avlocardyl® 40 mg", "Propranolol Générique 40 mg", "Aténolol Dekopharm 50 mg"]}]}}]}]}, {"id": "2", "title": "2. Pédiatrie", "specialties": [{"name": "Néonatalogie & Pathologies du Nouveau-né", "diseases": [{"name": "Détresse respiratoire du nouveau-né", "concepts": "Déficit en surfactant alvéolaire, immaturité pulmonaire, adaptation néonatale à la vie extra-utérine.", "urgences": "Maladie des membranes hysalines, inhalation méconiale massive, asphixie périnatale sévère.", "dretrepe": {"definition": "Difficulté respiratoire survenant dès les premières heures de vie chez le nouveau-né.", "rappel": "Transition de la circulation fœto-maternelle à la respiration autonome à la naissance.", "etiologie": "Immaturité pulmonaire (déficit en surfactant chez le prématuré), inhalation de liquide amniotique méconial, infection néonatale.", "traitement": "Administration de surfactant exogène, assistance respiratoire (CPAP ou ventilation mécanique), antibiothérapie probabiliste.", "evolution": "Résolution favorable avec une prise en charge adaptée, risque de séquelles pulmonaires chroniques (dysplasie broncho-pulmonaire).", "paraclinique": "Radiographie thoracique, gaz du sang artériels, oxymétrie de pouls."}, "id": "detresse-respiratoire-du-nouveau-ne", "specialty": "Néonatalogie & Pathologies du Nouveau-né", "partId": "2", "partName": "2. Pédiatrie", "pharmacology": {"title": "Bronchodilatateurs et anti-asthmatiques", "general": "Le traitement de la BPCO et de l'asthme repose sur des bronchodilatateurs (bêta-2 mimétiques, anticholinergiques) et des anti-inflammatoires (corticoïdes inhalés). Les bêta-2 mimétiques de courte durée (salbutamol) soulagent les crises ; les formes à longue durée (formotérol, salmétérol) assurent le contrôle de fond. En crise aiguë grave : salbutamol nébulisé, oxygène, corticothérapie systémique. Surveillance : débit expiratoire de pointe (DEP), saturation, gaz du sang. Risque d'hypokaliémie des bêta-2 mimétiques.", "molecules": [{"name": "Salbu r la réhydratation, seul traitement réellement efficace. Les SRO (sels de réhydratation orale OMS) exploitent le co-transport sodium-glucose intégral à la bordure en brosse entérocytaire. En cas de déshydratation sévère (choléra grivois), perfusion de Ringer Lactate IV rapide (100 mL/kg en 3 h chez l'adulte). L'antibiothérapie (doxycycline, azithromycine) est adjuvante : elle réduit la durée d'excrétion et la durée de diarrhée, mais ne remplace pas la réhydratation. Zinc 20 mg/j pendant 10–14 j chez l'enfant < 5 ans (OMS).", "molecules": [{"name": "SRO OMS (sels de réhydratation orale)", "posologie": "Adulte: 50–100 mL/kg/4 h ; Enfant: 75 mL/kg/4 h", "mecanisme": "Solution isotonique contenant sodium, potassium, glucose, citrate. Le glucose active le co-transporteur SGLT1 intestinal, permettant l'absorption hydrosodée malgré la toxine cholérique.", "marques": ["SRO Pharmakina (sachet OMS)", "SRO OMS (sachet)", "Oralyte® sachet"]}, {"name": "Ringer Lactate (perfusion IV)", "posologie": "100 mL/kg en 3 h IV, puis adapté aux pertes", "mecanisme": "Solution cristalloïde isotonique au plasma, apport Na+, K+, Ca²⁺ et lactate (tampon métabolique). Restauration rapide de la volémie en choc hypovolémique.", "marques": ["Ringer Lactate 500 mL perf", "Ringer Lactate 500 mL poche", "B. Braun Ringer Lactate"]}, {"name": "Doxycycline (adjuvant antibiothérapie choléra)", "posologie": "300 mg dose unique PO (adulte non enceinte)", "mecanisme": "Inhibition de la synthèse protéique ribosomale (30S), réduction de l'excrétion de Vibrio cholerae. Contre-indiqué chez la femme enceinte et l'enfant < 8 ans.", "marques": ["Doxycycline Pharmakina 100 mg", "Vibramycine® 100 mg", "Doxycycline Générique 100 mg", "Doxy-Uniquepharma 100 mg", "Doxy-Denk 100 mg / 200 mg", "Doxycycline-Shalina 100 mg"]}, {"name": "Zinc (complément pédiatrique OMS)", "posologie": "20 mg/j PO 10–14 jours chez l'enfant < 5 ans", "mecanisme": "Cofacteur enzymatique, restauration de la barrière intestinale, réduction de function icon(name, opts) {
  opts = opts || {};
  const path = ICON_PATHS[name] || '';
  const size = opts.size || '1em';
  const cls = opts.className || '';
  const color = opts.color ? `style="color:${opts.color}"` : '';
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="currentColor" class="${cls}" ${color} aria-hidden="true"><path d="${path}"/></svg>`;
}

function loadFirebaseDocs() {
  state.firebaseLoading = true;
  dbRef.ref('documents').on('value', (snapshot) => {
    const val = snapshot.val();
    state.firebaseDocs = val ? Object.entries(val).map(([id, doc]) => ({...doc, id})).sort((a,b) => (b.createdAt||0) - (a.createdAt||0)) : [];
    state.firebaseLoading = false;
    renderAll();
  }, (error) => {
    console.error('[Firebase] Erreur:', error);
    state.firebaseLoading = false;
    state.firebaseDocs = [];
    renderAll();
  });
}

function firebaseDocToDisease(doc) {
  return {
    id: doc.id || doc.name,
    name: doc.name,
    specialty: doc.specialty || 'Général',
    partId: doc.department || 'Firebase',
    partName: doc.department || 'Documents Firebase',
    concepts: doc.concepts || '',
    urgences: doc.urgences || '',
    dretrepe: {
      definition: doc.dretrepe?.definition || '',
      rappel: doc.dretrepe?.rappel || '',
      etiologie: doc.dretrepe?.etiologie || '',
      traitement: doc.dretrepe?.traitement || '',
      evolution: doc.dretrepe?.evolution || '',
      paraclinique: doc.dretrepe?.paraclinique || '',
    },
    pharmacology: doc.pharmacology || { title: 'Pharmacologie', general: 'Non disponible', molecules: [] },
  };
}

// HELPERS
// ════════════════════════════════════════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function findDisease(id) {
  const static_ = ALL_DISEASES.find(d => d.id === id);
  if (static_) return { disease: static_, source: 'static' };
  const fb = state.firebaseDocs.find(d => (d.id || d.name) === id);
  if (fb) return { disease: firebaseDocToDisease(fb), source: 'firebase' };
  return { disease: null, source: 'static' };
}

function renderTabBar() {
  const html = state.tabs.map(t => `
    <div class="tab-item ${t.id === state.activeTabId ? 'active' : ''}" onclick="switchTab('${t.id}')">
      <span style="width:.5rem;height:.5rem;border-radius:9999px;flex-shrink:0;background:${t.color}"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(t.title)}</span>
      ${state.tabs.length > 1 ? `<span class="tab-close" onclick="event.stopPropagation();closeTab('${t.id}')">×</span>` : ''}
    </div>`).join('') + `
    <button onclick="addNewTab()" style="width:2rem;height:2rem;border-radius:.5rem;background:rgba(13,17,26,0.6);border:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;color:#94a3b8;cursor:pointer;transition:all .15s;margin-bottom:.25rem;margin-left:.25rem;flex-shrink:0" title="Nouvel onglet">${icon('mdi:plus', {size:'18px'})}</button>`;
  document.getElementById('tabBar').innerHTML = html;
}
function switchTab(id) { state.activeTabId = id; renderAll(); }
function closeTab(id) {
  if (state.tabs.length <= 1) return;
  const idx = state.tabs.findIndex(t => t.id === id);
  state.tabs = state.tabs.filter(t => t.id !== id);
  if (state.activeTabId === id) state.activeTabId = state.tabs[Math.max(0, idx-1)].id;
  renderAll();
}
function addNewTab() {
  state.tabCounter++;
  const colors = ['#3b82f6','#34d399','#fb923c','#a78bfa','#f472b6'];
  const id = 'tab-' + state.tabCounter;
  state.tabs.push({id, title: 'Nouvelle Fiche', color: colors[state.tabCounter % colors.length]});
  state.activeTabId = id;
  renderAll();
  showToast('Nouvel onglet créé');
}

function openDisease(id, source) {
  // Check if this is a multi-pathology document (parent)
  const fbDoc = state.firebaseDocs.find(d => (d.id || d.name) === id);
  if (fbDoc && fbDoc.isMultiPathology && fbDoc.childPathologyIds && fbDoc.childPathologyIds.length > 0) {
    // Show the pathology list view
    state.selectedDocumentId = id;
    state.view = 'documentPathologies';
    renderAll();
    closeMobileSidebar();
    return;
  }
  
  const { disease } = findDisease(id);
  if (!disease) { showToast('Fiche non disponible'); return; }
  state.selectedDisease = disease;
  state.selectedDiseaseSource = source || 'static';
  state.activeSection = 'definition';
  closeMobileSidebar();
  renderDiseaseModal();
  document.getElementById('diseaseModalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeDiseaseModal() {
  state.selectedDisease = null;
  document.getElementById('diseaseModalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}
function setModalSection(key) {
  state.activeSection = key;
  renderDiseaseModal();
}

async function extractTextFromFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.pdf')) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let text = '';
    for (let i = 1; i <= Math.min(pdf.numPages, 200); i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(item => item.str).join(' ') + '\n\n';
    }
    await pdf.destroy();
    return text;
  }
  if (name.endsWith('.docx')) {
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({arrayBuffer});
    return result.value;
  }
  return await file.text();
}

async function categorizeWithKeywords(text, forcedDept, forcedSpec) {
  // Simple keyword-based categorization (client-side, no Gemini)
  const lower = text.toLowerCase();
  let dept = forcedDept || 'Médecine Interne';
  let spec = forcedSpec || '';
  if (!forcedDept) {
    if (lower.match(/chirurg|appendic|hernie|fracture|péritonite|brûlure/)) dept = 'Chirurgie';
    else if (lower.match(/grossesse|accouchement|gynéco|obstétri|éclampsie/)) dept = 'Gynécologie & Obstétrique';
    else if (lower.match(/enfant|pédiatri|nouveau-né|nourrisson/)) dept = 'Pédiatrie';
  }
  if (!spec) {
    if (lower.match(/cardi|cœur|cardiaque/)) spec = 'Cardiologie';
    else if (lower.match(/pneum|poumon|respirat/)) spec = 'Pneumologie';
    else if (lower.match(/palud|plasmod/)) spec = 'Infectiologie & Médecine Tropicale';
    else if (lower.match(/diabète|insulin|glycém/)) spec = 'Endocrinologie & Métabolisme';
    else spec = 'Général';
  }
  return { department: dept, specialty: spec };
}

async function uploadSingleFile(item) {
  item.stage = 'uploading';
  renderUploadModal();
  try {
    const text = await extractTextFromFile(item.file);
    if (!text || text.trim().length < 20) throw new Error('Texte vide ou trop court');
    const truncated = text.slice(0, 15000);
    
    let pathologies = [];
    let docName = item.file.name.replace(/\.[^.]+$/, '');
    let department = uploadState.department || '';
    let specialty = uploadState.specialty || '';
    let aiUsed = false;
    
    // Try Z-AI SDK first

        const zai = await ZAI.create();
        const completion = await zai.chat.completions.create({
          messages: [
            { role: 'system', content: 'Tu es un assistant médical expert qui répond UNIQUEMENT avec du JSON valide.' },
            { role: 'user', content: `Analyse ce document médical et identifie TOUTES les pathologies. Pour chaque pathologie, crée une fiche DRETEP.

${truncated}

        const aiText = completion.choices?.[0]?.message?.content || '';
        let jsonStr = aiText.trim();
        const jm = jsonStr.match(/```(?:json)?\s*([\s\S]*?)```/);
        if (jm) jsonStr = jm[1].trim();
        const fb2 = jsonStr.indexOf('{'); const lb2 = jsonStr.lastIndexOf('}');
        if (fb2 !== -1 && lb2 !== -1) jsonStr = jsonStr.slice(fb2, lb2 + 1);
        const parsed = JSON.parse(jsonStr);
        pathologies = parsed.pathologies || [];
        docName = parsed.name || docName;
        department = department || parsed.department || 'Médecine Interne';
        specialty = specialty || parsed.specialty || 'Général';
        aiUsed = true;
      }
    } catch (aiErr) { console.warn('Z-AI SDK non disponible', aiErr); }
    
    // If AI didn't work, split text into sections manually
    if (pathologies.length === 0) {
      const cat = await categorizeWithKeywords(truncated, department, specialty);
      department = cat.department;
      specialty = cat.specialty;
      
      // Try to split by section headers (numbered sections, ALL CAPS, etc.)
      const sections = splitTextIntoSections(truncated);
      pathologies = sections.map((section, i) => ({
        name: section.title || `Section ${i + 1}`,
        department,
        specialty,
        concepts: section.content.slice(0, 200),
        urgences: '',
        dretrepe: {
          definition: section.content.slice(0, 500) || 'Contenu à compléter',
          rappel: '',
          etiologie: '',
          traitement: '',
          evolution: '',
          paraclinique: '',
        },
        pharmacology: { title: 'Pharmacologie', general: 'À compléter', molecules: [] },
      }));
      
      // If no sections found, create one pathology with the document name
      if (pathologies.length === 0) {
        pathologies = [{
          name: docName,
          department, specialty,
          concepts: 'Document ajouté — contenu à analyser',
          urgences: '',
          dretrepe: { definition: 'Ce document contient du contenu médical. Cliquez sur les onglets pour naviguer.', rappel: '', etiologie: '', traitement: '', evolution: '', paraclinique: '' },
          pharmacology: { title: 'Pharmacologie', general: 'À compléter', molecules: [] },
        }];
      }
    }
    
    // ALWAYS create PARENT + CHILDREN structure
    const childIds = [];
    for (const pathology of pathologies) {
      const pathRef = dbRef.ref('documents').push();
      await pathRef.set({
        ...pathology,
        department: pathology.department || department,
        specialty: pathology.specialty || specialty,
        fileName: item.file.name,
        fileType: item.file.name.split('.').pop().toUpperCase(),
        fileSize: item.file.size,
        source: 'firebase',
        createdAt: Date.now(),
        rawText: '',
      });
      if (pathRef.key) childIds.push(pathRef.key);
    }
    
    // Create PARENT document (always isMultiPathology = true so clicking shows pathology list)
    const parentRef = dbRef.ref('documents').push();
    await parentRef.set({
      name: docName,
      department, specialty,
      concepts: `Document contenant ${childIds.length} pathologie(s)${aiUsed ? ' (analysé par IA)' : ' (à analyser)'}`,
      urgences: '',
      dretrepe: { definition: '', rappel: '', etiologie: '', traitement: '', evolution: '', paraclinique: '' },
      fileName: item.file.name,
      fileType: item.file.name.split('.').pop().toUpperCase(),
      fileSize: item.file.size,
      source: 'firebase',
      createdAt: Date.now(),
      isMultiPathology: true,
      childPathologyIds: childIds,
    });
    
    // Link children to parent
    for (const childId of childIds) {
      await dbRef.ref('documents/' + childId + '/parentDocId').set(parentRef.key);
    }
    
    item.stage = 'done';
    item.result = { name: docName, department, specialty, pathologiesCount: childIds.length };
  } catch (e) {
    item.stage = 'error';
    item.error = e.message;
  }
  renderUploadModal();
}

// Split text into sections by looking for chapter/section headers
function splitTextIntoSections(text) {
  const sections = [];
  // Try to split by numbered sections: "1. Title", "Chapitre 1", "I. Title", etc.
  const patterns = [
    /^(?:\d+[\.\)]\s+|[IVX]+\.\s+|Chapitre\s+\d+[\.\s:])/gmi,
  ];
  
  // Simple approach: split by lines that look like headers
  const lines = text.split('\n');
  let currentTitle = '';
  let currentContent = '';
  
  for (const line of lines) {
    const trimmed = line.trim();
    // Check if this line looks like a section header
    const isHeader = /^(?:\d+[\.\)]\s+|[IVX]+\.\s+|Chapitre\s+\d+|SECTION\s+\d+|PARTIE\s+\d+)/i.test(trimmed) ||
                     (/^[A-ZÉÈÀÂÔÛÎÏÇ][A-ZÉÈÀÂÔÛÎÏÇ\s\-]{5,60}$/.test(trimmed) && trimmed.length < 80);
    
    if (isHeader && trimmed.length > 3) {
      // Save previous section
      if (currentTitle && currentContent.trim().length > 50) {
        sections.push({ title: currentTitle, content: currentContent.trim() });
      }
      currentTitle = trimmed;
      currentContent = '';
    } else {
      currentContent += line + '\n';
    }
  }
  // Save last section
  if (currentTitle && currentContent.trim().length > 50) {
    sections.push({ title: currentTitle, content: currentContent.trim() });
  }
  
  return sections;
}

async function handleFiles(fileList) {
  Array.from(fileList).forEach(file => {
    uploadState.files.push({ id: Date.now()+'-'+Math.random(), file, stage: 'pending' });
  });
  renderUploadModal();
  // Auto-upload: start uploading immediately after files are added
  await uploadAll();
}

async function handleGenerate() {
  const name = document.getElementById('pathologyInput')?.value?.trim();
  if (!name) { showToast('Saisissez un nom de pathologie'); return; }
  
  state.generateStage = 'generating';
  renderGenerateModal();
  
  try {
    // Use Z-AI SDK if available (client-side)
    let generated = null;
    
    if (typeof ZAI !== 'undefined') {
      const zai = await ZAI.create();
      const completion = await zai.chat.completions.create({
        messages: [
          { role: 'system', content: 'Tu es un assistant médical expert qui répond UNIQUEMENT avec du JSON valide.' },
          { role: 'user', content: `Génère une fiche médicale complète pour la pathologie: "${name}". Département: ${state.generateDept || 'auto'}. Spécialité: ${state.generateSpec || 'auto'}.

Réponds UNIQUEMENT avec un objet JSON de cette forme:
{
  "name": "${name}",
  "department": "${state.generateDept || 'Médecine Interne'}",
  "specialty": "${state.generateSpec || 'Général'}",
  "concepts": "Concepts clés en 2-3 phrases détaillées",
  "urgences": "Urgences médicales associées",
  "dretrepe": {
    "definition": "Définition complète (3-4 phrases)",
    "rappel": "Rappel physiopathologique (3-4 phrases)",
    "etiologie": "Étiologies principales (3-4 phrases)",
    "traitement": "Traitement principal (3-4 phrases)",
    "evolution": "Évolution et pronostic (3-4 phrases)",
    "paraclinique": "Examens paracliniques (3-4 phrases)"
  },
  "pharmacology": {
    "title": "Titre pharmacologique",
    "general": "Pharmacologie générale (4-5 phrases)",
    "molecules": [
      {"name":"Molécule (classe)","posologie":"Posologie","mecanisme":"Mécanisme","marques":["Marque1 Orchidia","Marque2 Pharmakina","Marque3 Dekopharm"]}
    ]
  }
}

Génère AU MOINS 3 molécules. Réponds en français médical.` },
        ],
        temperature: 0.4,
        maxTokens: 4000,
      });
      
      const aiText = completion.choices?.[0]?.message?.content || '';
      let jsonStr = aiText.trim();
      const jsonMatch = jsonStr.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (jsonMatch) jsonStr = jsonMatch[1].trim();
      const fb = jsonStr.indexOf('{');
      const lb = jsonStr.lastIndexOf('}');
      if (fb !== -1 && lb !== -1) jsonStr = jsonStr.slice(fb, lb + 1);
      
      generated = JSON.parse(jsonStr);
    }
    
    if (generated) {
      generated.dretrepe = generated.dretrepe || { definition:'', rappel:'', etiologie:'', traitement:'', evolution:'', paraclinique:'' };
      generated.pharmacology = generated.pharmacology || { title:'Pharmacologie', general:'', molecules:[] };
      state.generateData = generated;
      state.generateStage = 'preview';
      renderGenerateModal();
    } else {
      throw new Error('SDK Z-AI non disponible');
    }
  } catch (e) {
    // Fallback: create a basic template
    const dept = state.generateDept || 'Médecine Interne';
    const spec = state.generateSpec || 'Général';
    state.generateData = {
      name,
      department: dept,
      specialty: spec,
      concepts: 'À compléter par le praticien',
      urgences: 'À évaluer selon le tableau clinique',
      dretrepe: {
        definition: `Définition de ${name} à compléter.`,
        rappel: 'Rappel physiopathologique à compléter.',
        etiologie: 'Étiologies à compléter.',
        traitement: 'Traitement à compléter.',
        evolution: 'Évolution à compléter.',
        paraclinique: 'Examens paracliniques à compléter.',
      },
      pharmacology: { title: `Pharmacologie de ${name}`, general: 'À compléter', molecules: [] },
    };
    state.generateStage = 'preview';
    renderGenerateModal();
    showToast('Mode hors-ligne: fiche modèle créée');
  }
}

async function saveGenerated() {
  if (!state.generateData) return;
  try {
    const newRef = dbRef.ref('documents').push();
    await newRef.set({
      ...state.generateData,
      fileName: `generee_${state.generateData.name.replace(/\s+/g,'_')}.md`,
      fileType: 'Générée par IA',
      fileSize: 0,
      source: 'firebase',
      createdAt: Date.now(),
      rawText: `Fiche générée pour ${state.generateData.name}`,
    });
    state.generateStage = 'done';
    renderGenerateModal();
    setTimeout(() => { closeGenerateModal(); }, 1500);
  } catch (e) {
    showToast('Erreur sauvegarde: ' + e.message);
  }
}

function goToDashboard() { state.view='dashboard'; state.activeSpecialty=null; closeMobileSidebar(); renderAll(); }
function goToSpecialty(partId, specialtyName) { state.view='specialty'; state.activeSpecialty={partId,specialtyName}; closeMobileSidebar(); renderAll(); }

function handleSearch(e) {
  if (e.key !== 'Enter') return;
  const q = e.target.value.toLowerCase().trim();
  if (!q) return;
  // Search static
  const found = ALL_DISEASES.find(d => d.name.toLowerCase().includes(q) || d.specialty.toLowerCase().includes(q));
  if (found) { openDisease(found.id, 'static'); e.target.value=''; return; }
  // Search Firebase
  const fbFound = state.firebaseDocs.find(d => d.name.toLowerCase().includes(q));
  if (fbFound) { openDisease(fbFound.id||fbFound.name, 'firebase'); e.target.value=''; return; }
  showToast('Aucun résultat');
}

// Render the pathology list view for a multi-pathology document
function renderDocumentPathologiesView() {
  const parentDoc = state.firebaseDocs.find(d => (d.id || d.name) === state.selectedDocumentId);
  if (!parentDoc) { renderDashboard(); return; }
  
  const childIds = parentDoc.childPathologyIds || [];
  const pathologies = childIds.map(id => state.firebaseDocs.find(d => d.id === id)).filter(Boolean);
  const deptName = (parentDoc.department || '').replace(/^\d+\.\s*/, '').trim();
  const color = '#34d399';
  
  const html = `
    <div style="space-y:1.5rem">
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem">
        <button onclick="state.view='dashboard';state.selectedDocumentId=null;renderAll()" style="width:2.5rem;height:2.5rem;border-radius:.75rem;background:rgba(255,255,255,0.05);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#cbd5e1;flex-shrink:0">${icon('mdi:arrow-left',{size:'20px'})}</button>
        <div style="min-width:0;flex:1">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8">${escapeHtml(deptName || parentDoc.department || 'Document')}</div>
          <h3 style="font-size:1.125rem;font-weight:700;color:#fff;truncate">${escapeHtml(parentDoc.name || 'Document')}</h3>
          <p style="font-size:12px;color:#94a3b8">${pathologies.length} pathologie${pathologies.length > 1 ? 's' : ''} dans ce document</p>
        </div>
        <span style="padding:.25rem .75rem;border-radius:9999px;font-size:10px;font-weight:700;background:${color}20;color:${color};flex-shrink:0">${escapeHtml(parentDoc.fileType || 'Document')}</span>
      </div>
      ${pathologies.length === 0 ? `<div class="glass-panel" style="padding:2rem;text-align:center;border-radius:1rem"><p style="color:#94a3b8">Aucune pathologie dans ce document</p></div>` : `
        <div class="cards-grid-3" style="margin-bottom:1.5rem">
          ${pathologies.map((p, i) => `<div class="featured-card" style="border-top:3px solid ${color}" onclick="openDisease('${p.id}','firebase')"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem"><span style="font-size:10px;font-weight:700;padding:.125rem .5rem;border-radius:.25rem;background:${color}20;color:${color}">Pathologie ${i+1}</span>${icon('mdi:arrow-top-right',{size:'18px'})}</div><h4 style="font-size:.875rem;font-weight:700;color:#fff;margin-bottom:.25rem">${escapeHtml(p.name || 'Pathologie ' + (i+1))}</h4><p class="line-clamp-2" style="font-size:12px;color:#94a3b8">${escapeHtml(p.dretrepe?.definition || p.concepts || 'Cliquez pour voir le schéma DRETEP')}</p><div style="margin-top:.75rem;display:flex;flex-wrap:wrap;gap:.25rem">${p.urgences ? `<span style="font-size:9px;padding:.125rem .5rem;border-radius:.25rem;background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.2)">Urgences</span>` : ''}${p.dretrepe?.definition ? `<span style="font-size:9px;padding:.125rem .5rem;border-radius:.25rem;background:rgba(255,255,255,0.05);color:#94a3b8">DRETEP</span>` : ''}${p.pharmacology?.molecules?.length > 0 ? `<span style="font-size:9px;padding:.125rem .5rem;border-radius:.25rem;background:rgba(59,130,246,0.1);color:#60a5fa;border:1px solid rgba(59,130,246,0.2)">Pharmaco</span>` : ''}</div></div>`).join('')}
        </div>
        <div class="glass-panel" style="border-radius:1rem;overflow:hidden">
          <div style="padding:1rem;border-bottom:1px solid rgba(255,255,255,0.05)"><h4 style="font-size:.875rem;font-weight:700;color:#fff">Vue d'ensemble — ${escapeHtml(parentDoc.name || 'Document')}</h4><p style="font-size:12px;color:#94a3b8;margin-top:.125rem">Cliquez sur une pathologie pour voir son schéma DRETEP</p></div>
          <div style="overflow-x:auto"><table class="custom-table"><thead><tr><th>Pathologie</th><th>Spécialité</th><th>Définition</th><th style="width:2.5rem"></th></tr></thead><tbody>${pathologies.map(p => `<tr style="cursor:pointer" onclick="openDisease('${p.id}','firebase')"><td style="font-weight:700;color:#fff;white-space:nowrap">${escapeHtml(p.name || '?')}</td><td style="color:#94a3b8">${escapeHtml(p.specialty || '—')}</td><td style="color:#94a3b8"><div class="line-clamp-2" style="max-width:24rem">${escapeHtml(p.dretrepe?.definition || '—')}</div></td><td>${icon('mdi:arrow-top-right',{size:'14px'})}</td></tr>`).join('')}</tbody></table></div>
        </div>
      `}
    </div>
  `;
  document.getElementById('mainContent').innerHTML = html;
}

// ESC closes modals
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('diseaseModalOverlay').classList.contains('show')) closeDiseaseModal();
    else if (document.getElementById('uploadModalOverlay').classList.contains('show')) closeUploadModal();
    else if (document.getElementById('generateModalOverlay').classList.contains('show')) closeGenerateModal();
  }
});

// Initialize
loadFirebaseDocs();
renderAll();
</script>
</body>
</html>
