<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MedGuide Pro — Plateforme de révision médicale complète. Sémiologie, pathologies, pharmacologie pour les 5 départements médicaux.">
  <title>MedGuide Pro — Révision Médicale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-text">MedGuide <strong>Pro</strong></span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <div class="nav-section-label">Tableau de Bord</div>
      <button class="nav-item active" id="nav-dashboard" onclick="showDashboard()">
        <span class="nav-icon">⊞</span>
        <span>Accueil</span>
      </button>
      <div class="nav-section-label" style="margin-top:20px">Départements</div>
      <div id="departmentNavList"></div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="user-avatar">🎓</div>
        <div class="user-info">
          <span class="user-name">Étudiant Médecine</span>
          <span class="user-level">Niveau Internat</span>
        </div>
      </div>
    </div>
  </aside>
  <!-- Mobile Menu Toggle -->
  <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleSidebar()">
    <span></span><span></span><span></span>
  </button>
  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- Dashboard View -->
    <div id="dashboardView" class="view active">
      <header class="page-header">
        <div>
          <h1 class="page-title">Tableau de Bord</h1>
          <p class="page-subtitle">Bienvenue sur votre guide diagnostique & thérapeutique</p>
        </div>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="globalSearch" placeholder="Rechercher une pathologie..." oninput="handleSearch(this.value)">
          <div class="search-results" id="searchResults"></div>
        </div>
      </header>
      <!-- Stats Banner -->
      <div class="stats-banner">
        <div class="stat-card" id="totalPathoStat">
          <div class="stat-icon">📚</div>
          <div class="stat-info">
            <span class="stat-value" id="totalPathologies">0</span>
            <span class="stat-label">Pathologies</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🏥</div>
          <div class="stat-info">
            <span class="stat-value">5</span>
            <span class="stat-label">Départements</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💊</div>
          <div class="stat-info">
            <span class="stat-value" id="totalDrugs">0</span>
            <span class="stat-label">Médicaments</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⚡</div>
          <div class="stat-info">
            <span class="stat-value" id="totalUrgent">0</span>
            <span class="stat-label">Urgences</span>
          </div>
        </div>
      </div>
      <!-- Department Cards Grid -->
      <div class="section-header">
        <h2 class="section-title">Choisissez votre département</h2>
      </div>
      <div class="departments-grid" id="departmentsGrid"></div>
    </div>
    <!-- Department View -->
    <div id="departmentView" class="view">
      <header class="page-header">
        <div class="breadcrumb">
          <button onclick="showDashboard()" class="breadcrumb-link">Accueil</button>
          <span class="breadcrumb-sep">›</span>
          <span id="deptBreadcrumb">Département</span>
        </div>
        <div class="dept-header-content">
          <div class="dept-header-icon" id="deptHeaderIcon"></div>
          <div>
            <h1 class="page-title" id="deptTitle"></h1>
            <p class="page-subtitle" id="deptDesc"></p>
          </div>
        </div>
      </header>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterPathologies('all', this)">Toutes</button>
        <button class="filter-btn" onclick="filterPathologies('Urgent', this)">🚨 Urgences</button>
        <button class="filter-btn" onclick="filterPathologies('Fondamental', this)">📌 Fondamentaux</button>
        <button class="filter-btn" onclick="filterPathologies('Intermédiaire', this)">📈 Intermédiaire</button>
      </div>
      <div class="pathologies-list" id="pathologiesList"></div>
    </div>
  </main>
  <!-- Pathology Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="pathologyModal" role="dialog" aria-modal="true">
      <div class="modal-sidebar">
        <div class="modal-dept-tag" id="modalDeptTag"></div>
        <div class="modal-title-block">
          <h2 id="modalTitle"></h2>
          <span class="modal-difficulty-badge" id="modalDifficulty"></span>
        </div>
        <nav class="modal-nav" id="modalNav"></nav>
        <div class="modal-progress" id="modalProgress"></div>
      </div>
      <div class="modal-body">
        <button class="modal-close" id="modalClose" onclick="closeModalDirect()" aria-label="Fermer">✕</button>
        <div class="modal-content" id="modalContent"></div>
      </div>
    </div>
  </div>
  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
